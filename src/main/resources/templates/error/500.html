<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Neočekávaná chyba (500)')}">
    <title>500 - Chyba serveru</title>
</head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="main-content" style="text-align: center; padding: 4rem 1rem;">
    <h1 style="font-size: 5rem; font-weight: 800; color: var(--danger); line-height: 1;">500</h1>
    <h2 style="font-size: 1.5rem; margin: 1rem 0;">Došlo k neočekávané chybě</h2>
    <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 2rem;" th:text="${errorMessage != null ? errorMessage : 'Při zpracování požadavku došlo k neočekávané chybě serveru.'}">
        Chybové hlášení...
    </p>
    <a th:href="@{/courses}" class="btn btn-primary">&larr; Zpět na úvodní stránku</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
