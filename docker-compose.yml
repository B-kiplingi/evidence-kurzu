version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: akademie_postgres
    restart: always
    environment:
      POSTGRES_DB: akademie_db
      POSTGRES_USER: akademie_user
      POSTGRES_PASSWORD: akademie_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akademie_user -d akademie_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: akademie_app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/akademie_db
      SPRING_DATASOURCE_USERNAME: akademie_user
      SPRING_DATASOURCE_PASSWORD: akademie_secret
      SPRING_PROFILES_ACTIVE: prod

volumes:
  postgres_data:
